services:
  kokoro-fastapi:
    build:
      context: .
      dockerfile: Dockerfile.cpu-script
    container_name: kokoro-fastapi
    ports:
      - "8880:8880"
    environment:
      - DOWNLOAD_MODEL=true
      - USE_GPU=false
      - USE_ONNX=false
      - MODEL_DIR=src/models
      - VOICES_DIR=src/voices/v1_0
    volumes:
      # Persistent storage for models (will be downloaded automatically)
      - kokoro_models:/app/api/src/models
      - kokoro_temp:/app/api/temp_files
      # Web files can be served from the container
      - kokoro_web:/app/web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s # Increased for model download time
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  kokoro_models:
    driver: local
  kokoro_temp:
    driver: local
  kokoro_web:
    driver: local
